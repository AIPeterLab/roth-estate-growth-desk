name: Daily dashboard update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Check New York window and refresh
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" || "$(TZ=America/New_York date +%H)" == "18" ]]; then python scripts/update_dashboard.py; fi
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update daily retirement dashboard
          file_pattern: data/dashboard.json
